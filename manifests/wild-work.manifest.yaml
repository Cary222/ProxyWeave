# ==============================================================================
# ProxyWeave Plugin Manifest (Schema 1.0 Draft)
# 模块目标: Wild-Work Multi-Channel Engine (Managed 模式草案)
# 验证状态: 待验证 (Pending Live Verification)
# 说明: 本文件为 Schema 1.0 语法样例草案，尚未在 ProxyWeave 运行态完成端到端加载与联调测试。
# ==============================================================================
schema_version: "1.0"
metadata:
  id: "wild-work"
  name: "Wild-Work Multi-Channel Engine"
  version: "2.6.0"
  author: "rockswang"
  description: "多渠道账号聚合引擎（支持 WorkBuddy、TraeWork、Qoder 等多渠道）"
  homepage: "https://github.com/rockswang/wild-work"
  license: "MIT"

compatibility:
  min_host_version: "0.1.0"
  supported_os: ["windows", "darwin", "linux"]
  supported_arch: ["x86_64", "aarch64"]

distribution:
  repository: "https://github.com/rockswang/wild-work"
  release_asset_pattern:
    windows_x86_64: 'wild-work-.*-windows-amd64\.zip'
    darwin_aarch64: 'wild-work-.*-darwin-arm64\.tar\.gz'
    linux_x86_64: 'wild-work-.*-linux-amd64\.tar\.gz'

runtime:
  type: "binary"
  entrypoint:
    windows: "bin/wild-work.exe"
    darwin: "bin/wild-work"
    linux: "bin/wild-work"
  args: ["--headless", "--port", "{PORT}", "--data-dir", "{DATA_DIR}"]
  env:
    GIN_MODE: "release"
  working_dir: "{DATA_DIR}"

lifecycle:
  policy: "idle_timeout"
  idle_timeout_seconds: 300
  startup_timeout_seconds: 15
  stop_signal: "SIGTERM"
  graceful_timeout_seconds: 5

network:
  listen_host: "127.0.0.1"
  port_allocation: "dynamic"
  health_check:
    type: "http"
    path: "/v1/models"
    interval_seconds: 30
    timeout_seconds: 3
    expected_status: 200

capabilities:
  protocols: ["openai_chat", "streaming", "tool_calling"]
  # 流式规整配置：仅在正常接收完整尾帧且遗漏终止符时补齐，上游异常截断时坚决不补发 [DONE]
  stream_normalizer:
    guarantee_normal_termination: true
    forbid_done_on_error: true

security:
  requires_secrets: ["auth_token"]
  permissions:
    allow_internet_access: true
    allow_local_storage: true
    disallow_arbitrary_fs: true
