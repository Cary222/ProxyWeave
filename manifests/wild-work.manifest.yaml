schema_version: "1.0"
id: "wild-work"
name: "Wild-Work Multi-Channel Engine"
version: "2.6.0"
author: "rockswang"
description: "多渠道账号聚合引擎（支持 WorkBuddy、TraeWork、Qoder、MonkeyCode、商汤小浣熊、讯飞 Loomy 等 12 渠道）"
homepage: "https://github.com/rockswang/wild-work"

# 1. 远端同步与构建产物定义 (Git-Native / Release 自动拉取)
source:
  type: "github_release"
  repo: "rockswang/wild-work"
  asset_match:
    windows_amd64: "wild-work-.*-windows-amd64\\.zip"
    darwin_arm64: "wild-work-.*-darwin-arm64\\.tar\\.gz"
    linux_amd64: "wild-work-.*-linux-amd64\\.tar\\.gz"

# 2. 运行规约与环境注入
runtime:
  type: "binary"
  executable:
    windows: "wild-work.exe"
    darwin: "wild-work"
    linux: "wild-work"
  args: 
    - "--headless"
    - "--port"
    - "{AUTO_PORT}"
    - "--data-dir"
    - "./data"
  env:
    PORT: "{AUTO_PORT}"
    HOST: "127.0.0.1"
    GIN_MODE: "release"

# 3. 健康检查与就绪探针 (用于按需冷启动时的就绪判定)
health_check:
  type: "http"
  path: "/v1/models"
  expected_status: 200
  timeout_ms: 3000

# 4. 生命周期策略 (Serverless 按需休眠与冷启动)
lifecycle:
  idle_ttl_seconds: 300              # 连续 5 分钟无调用，自动 SIGTERM 回收进程 (0MB 内存)
  max_cold_start_timeout_ms: 2500    # 首次唤醒请求挂起上限

# 5. 协议清洗与中间件流水线 (Pipeline Middlewares)
pipeline_middlewares:
  developer_to_system_role: true     # 自动将下游 Agent 的 developer 角色转为 system
  sticky_session: true               # 开启粘性会话，保障长上下文 Prompt Cache 命中率
  stream_done_guard: true            # 针对异常断开自动补全 data: [DONE]

# 6. 路由与模型映射暴露 (统一汇聚到基座 8080)
exports:
  base_url: "http://127.0.0.1:{AUTO_PORT}"
  route_prefix: "wild"
  models:
    - id: "codebuddy/claude-3-7-sonnet"
      alias: ["wild/claude-3-7-sonnet", "wild/cb-claude-3-7"]
      stream_passthrough: true
    - id: "trae/claude-3-7-sonnet"
      alias: ["wild/trae-claude-3-7", "wild/trae"]
      stream_passthrough: true
    - id: "qoder/claude-3-7-sonnet"
      alias: ["wild/qoder-claude-3-7", "wild/qoder"]
      stream_passthrough: true
    - id: "raccoon/chat"
      alias: ["wild/raccoon"]
      stream_passthrough: true
    - id: "loomy/chat"
      alias: ["wild/loomy"]
      stream_passthrough: true

# 7. 用户动态配置清单 (客户端自动渲染配置表单)
config_schema:
  - key: "auth_token"
    label: "Web 访问令牌 (可选)"
    type: "password"
    required: false
    description: "如果需要保护 wild-work 的 Web 面板，可在此设置访问密钥"
  - key: "data_dir"
    label: "数据与凭据存储目录"
    type: "string"
    default: "./data"
    required: true
    description: "wild-work 存放 auths 与账号状态的目录"
