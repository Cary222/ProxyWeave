[package]
name = "proxyweave-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
test-support = []

[dev-dependencies]
proxyweave-plugin = { path = ".", features = ["test-support"] }

# Test-only Managed plugin stand-in (spec v10 port suite). Built only with `test-support`,
# which is what the crate's own test targets enable.
[[bin]]
name = "pw-port-fixture"
path = "src/bin/pw-port-fixture.rs"
required-features = ["test-support"]

[dependencies]
quotio-platform = { path = "../quotio-platform" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "=0.10.0"
regex = "=1.12.3"
sha2 = "=0.10.9"
semver = "=1.0.28"
url = "=2.5.8"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
zip = "2.4.2"
flate2 = "1"
tar = "0.4.46"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[test]]
name = "plugin-lifecycle"
path = "../../tests/test_plugin_lifecycle.rs"

[[test]]
name = "credential-contract"
path = "../../tests/test_credential_contract.rs"

[[test]]
name = "directory-watcher"
path = "../../tests/test_directory_watcher.rs"

[[test]]
name = "workbench-ipc"
path = "../../tests/test_workbench_ipc.rs"
