[package]
name = "proxyweave-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
proxyweave-plugin = { path = "../proxyweave-plugin" }
proxyweave-protocols = { path = "../proxyweave-protocols" }
async-stream = "0.3"
axum = "=0.8.9"
axum-reverse-proxy = { version = "=2.2.0", default-features = false, features = ["native-tls"] }
bytes = "1"
eventsource-stream = "=0.2.3"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "client-legacy", "http1"] }
hyper-tls = "0.6"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["validate-request"] }
url = "=2.5.8"
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["stream", "native-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["io-util"] }
tempfile = "=3.27.0"
serde_json.workspace = true
sha2 = "=0.10.9"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }
