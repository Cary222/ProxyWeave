[package]
name = "proxyweave-protocols"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
inventory = "0.3"
futures = "0.3"

[dev-dependencies]
proptest = "1"
insta = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
