name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). If omitted, falls back to version from package.json with v-prefix'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      tag_name: ${{ steps.create-release.outputs.tag_name }}
      version: ${{ steps.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION=$(node -p "require('./apps/desktop/package.json').version")
            TAG="v${VERSION}"
          fi
          VERSION="${TAG#v}"
          echo "Resolved release tag: $TAG (version: $VERSION)"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create draft GitHub release
        id: create-release
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ steps.resolve-tag.outputs.tag_name }}
          VERSION: ${{ steps.resolve-tag.outputs.version }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const version = process.env.VERSION;
            let release;
            try {
              const res = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
              release = res.data;
              console.log(`Found existing release for tag ${tag} (id: ${release.id})`);
            } catch (err) {
              console.log(`Creating new draft release for tag ${tag}...`);
              const res = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `ProxyWeave ${tag}`,
                body: `ProxyWeave desktop release ${tag}.\n\n### Integrity Verification\nTo verify downloaded assets, download \`SHA256SUMS.txt\` and run:\n\`\`\`bash\nsha256sum -c SHA256SUMS.txt\n\`\`\`\n\n> Note: Unsigned community build (code signing and notarization not included).`,
                draft: true,
                prerelease: false,
              });
              release = res.data;
              console.log(`Created draft release (id: ${release.id})`);
            }
            core.setOutput('release_id', release.id);
            core.setOutput('tag_name', tag);
            core.setOutput('version', version);

  build-tauri:
    name: Build desktop (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-latest
            args: ''
          - platform: macos-latest
            args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend (inject embedded static assets)
        working-directory: apps/desktop
        run: npm run build

      - name: Build Tauri desktop package
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Upload bundle artifacts for checksum generation
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.zip
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.zip
          if-no-files-found: error

  publish-release:
    name: Generate checksums and publish release
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: release-artifacts

      - name: Generate SHA256 checksums
        run: |
          set -e
          ARTIFACTS_DIR="release-artifacts"
          echo "=== Inspecting release-artifacts directory ==="
          if [ ! -d "$ARTIFACTS_DIR" ]; then
            echo "Error: Directory $ARTIFACTS_DIR does not exist!"
            exit 1
          fi

          echo "Directory structure (up to 50 files):"
          find "$ARTIFACTS_DIR" -type f | head -50

          WIN_COUNT=$(find "$ARTIFACTS_DIR" -path "*/bundles-windows-latest/*" -type f | wc -l)
          UBU_COUNT=$(find "$ARTIFACTS_DIR" -path "*/bundles-ubuntu-latest/*" -type f | wc -l)
          MAC_COUNT=$(find "$ARTIFACTS_DIR" -path "*/bundles-macos-latest/*" -type f | wc -l)
          TOTAL_COUNT=$(find "$ARTIFACTS_DIR" -type f ! -name "SHA256SUMS.txt" ! -name ".*" | wc -l)

          echo "Found bundle files: Windows=$WIN_COUNT, Ubuntu=$UBU_COUNT, macOS=$MAC_COUNT, Total=$TOTAL_COUNT"

          if [ "$WIN_COUNT" -lt 1 ] || [ "$UBU_COUNT" -lt 1 ] || [ "$MAC_COUNT" -lt 1 ]; then
            echo "Error: Missing bundle artifacts for one or more platforms!"
            echo "Expected at least 1 artifact per platform, got Windows=$WIN_COUNT, Ubuntu=$UBU_COUNT, macOS=$MAC_COUNT"
            echo "Actual files in $ARTIFACTS_DIR:"
            find "$ARTIFACTS_DIR" -type f | head -50
            exit 1
          fi

          rm -f SHA256SUMS.txt.tmp SHA256SUMS.txt
          while IFS= read -r filepath; do
            fname=$(basename "$filepath")
            hash=$(sha256sum "$filepath" | awk '{print $1}')
            echo "$hash  $fname" >> SHA256SUMS.txt.tmp
          done < <(find "$ARTIFACTS_DIR" -type f ! -name "SHA256SUMS.txt" ! -name ".*" | sort)

          sort -k2 SHA256SUMS.txt.tmp > SHA256SUMS.txt
          rm -f SHA256SUMS.txt.tmp

          if [ ! -s SHA256SUMS.txt ]; then
            echo "Error: Generated SHA256SUMS.txt is empty!"
            echo "Actual directory contents:"
            find "$ARTIFACTS_DIR" -type f | head -50
            exit 1
          fi

          DUPS=$(awk '{print $2}' SHA256SUMS.txt | sort | uniq -d)
          if [ -n "$DUPS" ]; then
            echo "Error: Duplicate asset filenames detected in SHA256SUMS.txt:"
            echo "$DUPS"
            echo "Actual directory contents:"
            find "$ARTIFACTS_DIR" -type f | head -50
            exit 1
          fi

          echo "=== Generated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Diagnostic directory dump on failure
        if: failure()
        run: |
          echo "=== Diagnostic dump of release-artifacts on failure ==="
          if [ -d "release-artifacts" ]; then
            find release-artifacts -type f | head -50
          else
            echo "Directory release-artifacts does not exist."
            ls -la
          fi
      - name: Upload SHA256SUMS.txt and publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        with:
          script: |
            const fs = require('fs');
            const release_id = Number(process.env.RELEASE_ID);

            // 1. Remove existing SHA256SUMS.txt asset if present (e.g. re-run)
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id,
            });
            const existing = assets.find(a => a.name === 'SHA256SUMS.txt');
            if (existing) {
              console.log(`Deleting existing SHA256SUMS.txt asset (${existing.id})...`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id,
              });
            }

            // 2. Upload SHA256SUMS.txt
            console.log(`Uploading SHA256SUMS.txt to release ${release_id}...`);
            const fileData = fs.readFileSync('SHA256SUMS.txt');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id,
              name: 'SHA256SUMS.txt',
              data: fileData,
              headers: {
                'content-type': 'text/plain; charset=utf-8',
                'content-length': fileData.length,
              },
            });

            // 3. Publish the release (draft: false)
            console.log(`Publishing release ${release_id} (draft: false)...`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id,
              draft: false,
            });
            console.log('Release published successfully.');
